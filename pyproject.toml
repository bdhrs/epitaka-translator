[project]
name = "epitaka-translator"
version = "0.1.0"
description = "Translate Pāli Theravāda books into modern languages with an LLM."
# <3.14: aksharamukha 2.3 imports ast.Str, which Python 3.14 removes.
requires-python = ">=3.10,<3.14"
dependencies = [
    "google-genai==2.18.1",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
    "aksharamukha==2.3",
]

[dependency-groups]
dev = [
    "pytest",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
